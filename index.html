<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chapter Ops Dashboard</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="app-header">
  <div class="app-header-title">
    <h1>Chapter Ops Dashboard</h1>
    <p class="subtitle">Track every office you're waiting on, in one place.</p>
  </div>
  <div class="app-header-actions">
    <button id="exportBtn" class="btn btn-secondary">Export</button>
    <label class="btn btn-secondary file-btn">
      Import
      <input type="file" id="importInput" accept="application/json" hidden />
    </label>
    <button id="addOfficeBtn" class="btn btn-primary">+ Add Office</button>
  </div>
</header>

<section class="summary-bar" id="summaryBar"></section>

<section class="filter-bar">
  <label for="filterSelect">Show:</label>
  <select id="filterSelect">
    <option value="all">All open items</option>
    <option value="overdue">Overdue</option>
    <option value="waiting">Waiting on them</option>
    <option value="week">Due this week</option>
    <option value="done">Completed</option>
  </select>
</section>

<main id="officesContainer" class="offices-grid"></main>

<p id="emptyState" class="empty-state" hidden>
  No offices yet. Click <strong>+ Add Office</strong> to start tracking (e.g. Office of Sorority &amp; Fraternity Life, Housing, Parking Services).
</p>

<!-- Office modal -->
<div class="modal-backdrop" id="officeModalBackdrop" hidden>
  <div class="modal">
    <h2 id="officeModalTitle">Add Office</h2>
    <form id="officeForm">
      <input type="hidden" id="officeId" />
      <label>Office / contact name
        <input type="text" id="officeName" required placeholder="e.g. Office of Sorority &amp; Fraternity Life" />
      </label>
      <label>Contact person (optional)
        <input type="text" id="officeContact" placeholder="e.g. Jane Smith" />
      </label>
      <label>Email (optional)
        <input type="email" id="officeEmail" placeholder="e.g. jane.smith@emory.edu" />
      </label>
      <label>Notes (optional)
        <textarea id="officeNotes" rows="2" placeholder="Anything worth remembering about this relationship"></textarea>
      </label>
      <div class="modal-actions">
        <button type="button" class="btn btn-danger" id="deleteOfficeBtn" hidden>Delete Office</button>
        <span class="spacer"></span>
        <button type="button" class="btn btn-secondary" id="cancelOfficeBtn">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Item modal -->
<div class="modal-backdrop" id="itemModalBackdrop" hidden>
  <div class="modal">
    <h2 id="itemModalTitle">Add Item</h2>
    <form id="itemForm">
      <input type="hidden" id="itemId" />
      <input type="hidden" id="itemOfficeId" />
      <label>What do you need from them?
        <input type="text" id="itemTitle" required placeholder="e.g. Confirm move-in date for philanthropy event" />
      </label>
      <label>Details (optional)
        <textarea id="itemDetails" rows="2"></textarea>
      </label>
      <label>Due date (optional)
        <input type="date" id="itemDueDate" />
      </label>
      <label>Status
        <select id="itemStatus">
          <option value="not_started">Not started</option>
          <option value="in_progress">In progress</option>
          <option value="waiting">Waiting on them</option>
          <option value="done">Done</option>
        </select>
      </label>
      <div class="modal-actions">
        <button type="button" class="btn btn-danger" id="deleteItemBtn" hidden>Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn btn-secondary" id="cancelItemBtn">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Document modal -->
<div class="modal-backdrop" id="documentModalBackdrop" hidden>
  <div class="modal">
    <h2 id="documentModalTitle">Add Document</h2>
    <form id="documentForm">
      <input type="hidden" id="documentId" />
      <input type="hidden" id="documentOfficeId" />
      <label>Label
        <input type="text" id="documentLabel" required placeholder="e.g. R4L Non-Compliance Notice" />
      </label>
      <label>Link
        <input type="url" id="documentUrl" required placeholder="https://drive.google.com/..." />
      </label>
      <div class="modal-actions">
        <button type="button" class="btn btn-danger" id="deleteDocumentBtn" hidden>Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn btn-secondary" id="cancelDocumentBtn">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
